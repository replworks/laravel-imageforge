name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: "8.3"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
          - php: "8.4"
            laravel: "13.*"
            testbench: "11.*"
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Testbench ${{ matrix.testbench }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Run PHPUnit
        run: composer test
